services:
  - type: web
    name: smartpath
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      # Optional: enables the Google Maps satellite view.
      # Leave blank to use the built-in Leaflet/OpenStreetMap map.
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
